<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yosugala スケジュール アーカイブ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
:root{
  --bg:#f7f7f5;--card:#fff;--ink:#1c1c1c;--muted:#6b6b6b;--line:#e3e3df;
  --live:#c2185b;--event:#00796b;--other:#5c6bc0;
  --add:#2e7d32;--add-bg:#e8f5e9;--del:#c62828;--del-bg:#fdecea;--chg:#ef6c00;--chg-bg:#fff3e0;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141414;--card:#1e1e1e;--ink:#ececec;--muted:#9a9a9a;--line:#333;
    --add-bg:#1b3320;--del-bg:#3a1b1b;--chg-bg:#3a2a12;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{padding:20px 16px 8px;max-width:960px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;padding:8px 16px;max-width:960px;margin:0 auto;flex-wrap:wrap;align-items:center}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:14px}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:8px;padding:4px 16px 12px;max-width:960px;margin:0 auto;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:14px}
.filters input{flex:1;min-width:160px}
main{max-width:960px;margin:0 auto;padding:0 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card.removed{opacity:.75}
.card>summary{list-style:none;display:flex;gap:14px;padding:12px 14px;cursor:pointer;align-items:flex-start}
.card>summary::-webkit-details-marker{display:none}
.date{min-width:64px;text-align:center;line-height:1.1}
.date .d{font-size:26px;font-weight:700}
.date .m{font-size:12px;color:var(--muted)}
.date .w{font-size:11px;color:var(--muted)}
.body{flex:1;min-width:0}
.title{font-weight:600;margin:2px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.tag{padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.tag.cat{color:#fff;border:0}
.tag.cat.LIVE{background:var(--live)}.tag.cat.EVENT{background:var(--event)}.tag.cat.other{background:var(--other)}
.tag.st-removed{background:var(--del-bg);color:var(--del);border-color:transparent}
.tag.st-cancel{background:var(--del);color:#fff;border-color:transparent}
.tag.st-done{background:var(--line)}
.tag.st-new{background:var(--add-bg);color:var(--add);border-color:transparent}
.tag.st-chg{background:var(--chg-bg);color:var(--chg);border-color:transparent}
.detail{padding:0 14px 14px 92px;font-size:14px}
@media (max-width:600px){.detail{padding-left:14px}}
.detail dl{margin:8px 0;display:grid;grid-template-columns:8em 1fr;gap:4px 12px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;white-space:pre-wrap;word-break:break-word}
.detail .info{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.detail .info img{max-width:100%;height:auto}
.detail .info a{color:inherit}
.detail .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.detail .imgs img{max-width:200px;max-height:200px;border-radius:6px}
.hist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hist h4{margin:0 0 4px;font-size:13px;color:var(--muted)}
.hist ul{margin:0;padding-left:18px;font-size:13px}
.hist details{margin-top:4px}
.hist .diff{background:var(--bg);padding:6px 8px;border-radius:6px;white-space:pre-wrap;font-size:12px;margin:4px 0}
.hist .diff .old{color:var(--del);text-decoration:line-through}
.hist .diff .new{color:var(--add)}
a.src{color:var(--muted);font-size:12px}
.run{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.run h3{margin:0 0 6px;font-size:15px}
.run .n{color:var(--muted);font-size:13px;font-weight:normal}
.run ul{margin:4px 0;padding-left:0;list-style:none}
.run li{padding:4px 8px;border-radius:6px;margin:2px 0;font-size:14px}
.run li.add{background:var(--add-bg)}.run li.del{background:var(--del-bg)}.run li.chg{background:var(--chg-bg)}
.run li b{font-size:11px;margin-right:6px}
.run li.add b{color:var(--add)}.run li.del b{color:var(--del)}.run li.chg b{color:var(--chg)}
.run .quiet{color:var(--muted);font-size:13px}
.month{font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:600}
.empty{color:var(--muted);padding:30px;text-align:center}
.detail .info img,.detail .imgs img{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:100;align-items:center;justify-content:center;flex-direction:column}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:4px;box-shadow:0 4px 30px rgba(0,0,0,.5);cursor:zoom-out}
#lb .cnt{color:#ddd;font-size:13px;margin-top:10px}
#lb button{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:28px;width:48px;height:64px;border-radius:8px;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.3)}
#lb .prev{left:10px}#lb .next{right:10px}
#lb .close{top:14px;right:14px;transform:none;width:40px;height:40px;font-size:22px;line-height:1}
#lb button[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>yosugala スケジュール アーカイブ</h1>
  <div class="meta" id="meta"></div>
</header>
<nav>
  <button data-tab="events" class="on">予定一覧</button>
  <button data-tab="changes">変更履歴</button>
</nav>
<div class="filters" id="filters">
  <select id="status">
    <option value="all">すべての状態</option>
    <option value="listed">掲載中</option>
    <option value="removed">サイトから削除済み</option>
    <option value="cancel">公演日前に削除</option>
    <option value="changed">内容が変更されたもの</option>
  </select>
  <select id="cat"><option value="all">すべての種別</option></select>
  <select id="order">
    <option value="date-asc">公演日 昇順</option>
    <option value="date-desc">公演日 降順</option>
    <option value="seen-desc">発見が新しい順</option>
  </select>
  <input id="q" type="search" placeholder="タイトル・会場で検索">
</div>
<main id="main"></main>
<div id="lb" role="dialog" aria-label="画像の拡大表示">
  <button class="close" title="閉じる (Esc)">×</button>
  <button class="prev" title="前の画像 (←)">‹</button>
  <img alt="">
  <button class="next" title="次の画像 (→)">›</button>
  <div class="cnt"></div>
</div>
<script src="data.js"></script>
<script>
(function(){
  const A = window.ARCHIVE || {events:{}, changes:[]};
  const events = Object.values(A.events);
  const byId = A.events;
  const changes = (A.changes||[]).slice().reverse();
  const today = new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Tokyo'}); // YYYY-MM-DD
  const $ = s => document.querySelector(s);
  const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const WD = {MON:'月',TUE:'火',WED:'水',THU:'木',FRI:'金',SAT:'土',SUN:'日'};

  const listedCount = events.filter(e=>!e.removed_at).length;
  $('#meta').textContent = `最終取得: ${A.generated_at ? A.generated_at.replace('T',' ').slice(0,16) : '-'} ／ 蓄積 ${events.length} 件（掲載中 ${listedCount} ・ 削除済み ${events.length-listedCount}）／ 取得回数 ${changes.length}`;

  // 種別セレクト
  const cats = [...new Set(events.map(e=>e.current.category))].sort();
  for (const c of cats){ const o=document.createElement('option'); o.value=c; o.textContent=c; $('#cat').appendChild(o); }

  function status(e){
    const d = e.current.date || '';
    if (e.removed_at){
      return d && e.removed_at <= d ? 'cancel' : 'removed';
    }
    return d && d < today ? 'done' : 'listed';
  }
  const STATUS_LABEL = {listed:'掲載中', done:'掲載中（公演済み）', removed:'サイトから削除済み', cancel:'公演日前に削除'};

  function catClass(c){ return c==='LIVE'||c==='EVENT' ? c : 'other'; }

  function dateBox(d, youbi){
    if(!d) return `<div class="date"><div class="d">?</div></div>`;
    const [y,m,dd]=d.split('-');
    return `<div class="date"><div class="m">${y}.${m}</div><div class="d">${dd}</div><div class="w">${WD[youbi]||youbi||''}</div></div>`;
  }

  function fieldDiff(a, b){
    // 2つの版の fields を比べて差分行を返す
    const out=[]; const keys=[...new Set([...Object.keys(a.fields||{}),...Object.keys(b.fields||{})])];
    if(a.title!==b.title) out.push(`<div class="diff">タイトル\n<span class="old">${esc(a.title)}</span>\n<span class="new">${esc(b.title)}</span></div>`);
    if(a.date!==b.date) out.push(`<div class="diff">公演日\n<span class="old">${esc(a.date)}</span>\n<span class="new">${esc(b.date)}</span></div>`);
    if(a.category!==b.category) out.push(`<div class="diff">種別\n<span class="old">${esc(a.category)}</span>\n<span class="new">${esc(b.category)}</span></div>`);
    for(const k of keys){
      const x=(a.fields||{})[k], y=(b.fields||{})[k];
      if(x!==y) out.push(`<div class="diff">${esc(k)}\n<span class="old">${esc(x??'（なし）')}</span>\n<span class="new">${esc(y??'（なし）')}</span></div>`);
    }
    const ia=(a.images||[]).join(), ib=(b.images||[]).join();
    if(ia!==ib) out.push(`<div class="diff">画像が変更されました</div>`);
    return out.join('') || '<div class="diff">（細かな変更）</div>';
  }

  function safeHtml(h){
    // 公式サイト由来のHTMLだが、念のため script / イベント属性は除去
    return String(h||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+="[^"]*"/gi,'');
  }

  function card(e){
    const c=e.current, st=status(e);
    const tags=[`<span class="tag cat ${catClass(c.category)}">${esc(c.category)}</span>`];
    if(st!=='listed') tags.push(`<span class="tag st-${st}">${STATUS_LABEL[st]}${e.removed_at?'（'+e.removed_at+'）':''}</span>`);
    if(e.first_seen===today && changes.length>1) tags.push(`<span class="tag st-new">本日追加</span>`);
    if(e.history.length>1) tags.push(`<span class="tag st-chg">変更 ${e.history.length-1} 回</span>`);
    tags.push(`<span class="tag">初回発見 ${e.first_seen}</span>`);
    const venue = c.fields['開催場所・会場'] || '';
    const fields = Object.entries(c.fields).filter(([k])=>k!=='INFO');
    const hist = e.history.length>1 ? `<div class="hist"><h4>変更履歴</h4>
      ${e.history.slice(1).map((h,i)=>`<details><summary>${h.seen}：${(h.changed||[]).map(x=>({title:'タイトル',date:'公演日',category:'種別',fields:'詳細',images:'画像',thumbnail:'サムネイル'}[x]||x)).join('・')} が変更</summary>${fieldDiff(e.history[i].data,h.data)}</details>`).join('')}
      </div>` : '';
    return `<details class="card ${st==='removed'||st==='cancel'?'removed':''}" id="ev-${e.id}">
      <summary>${dateBox(c.date,c.youbi)}<div class="body">
        <div class="title">${esc(c.title)}</div>
        <div class="meta">${esc(venue)}</div>
        <div class="tags">${tags.join('')}</div>
      </div></summary>
      <div class="detail">
        <dl>${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        ${c.info_html?`<div class="info">${safeHtml(c.info_html)}</div>`:(c.fields.INFO?`<div class="info" style="white-space:pre-wrap">${esc(c.fields.INFO)}</div>`:'')}
        <div><a class="src" href="${esc(e.url)}" target="_blank" rel="noopener">元ページ（削除後はリンク切れ） ↗</a></div>
        ${hist}
      </div>
    </details>`;
  }

  function renderEvents(){
    const st=$('#status').value, cat=$('#cat').value, q=$('#q').value.trim().toLowerCase(), order=$('#order').value;
    let list=events.filter(e=>{
      const s=status(e);
      if(st==='listed' && (s==='removed'||s==='cancel')) return false;
      if(st==='removed' && !(s==='removed'||s==='cancel')) return false;
      if(st==='cancel' && s!=='cancel') return false;
      if(st==='changed' && e.history.length<2) return false;
      if(cat!=='all' && e.current.category!==cat) return false;
      if(q){ const hay=(e.current.title+' '+(e.current.fields['開催場所・会場']||'')+' '+(e.current.fields['出演']||'')).toLowerCase(); if(!hay.includes(q)) return false; }
      return true;
    });
    const key=e=>e.current.date||'9999';
    if(order==='date-asc') list.sort((a,b)=>key(a).localeCompare(key(b)));
    else if(order==='date-desc') list.sort((a,b)=>key(b).localeCompare(key(a)));
    else list.sort((a,b)=>(b.first_seen+b.id).localeCompare(a.first_seen+a.id));
    if(!list.length){ $('#main').innerHTML='<div class="empty">該当する予定はありません</div>'; return; }
    let html='', lastMonth='';
    for(const e of list){
      const m=(e.current.date||'').slice(0,7);
      if(order.startsWith('date') && m!==lastMonth){ html+=`<div class="month">${m.replace('-','年')}月</div>`; lastMonth=m; }
      html+=card(e);
    }
    $('#main').innerHTML=html;
  }

  function renderChanges(){
    if(!changes.length){ $('#main').innerHTML='<div class="empty">まだ取得履歴がありません</div>'; return; }
    const line=(cls,label,id,extra)=>{ const e=byId[id]; const t=e?`${e.current.date||''} ${esc(e.current.title)}`:id;
      return `<li class="${cls}"><b>${label}</b><a href="#" data-goto="${id}" style="color:inherit;text-decoration:none">${t}</a>${extra||''}</li>`; };
    $('#main').innerHTML = changes.map(r=>{
      const items=[
        ...r.added.map(id=>line('add','追加',id)),
        ...r.removed.map(id=>line('del','削除',id)),
        ...r.changed.map(x=>line('chg','変更',x.id,` <span class="n">（${x.fields.map(f=>({title:'タイトル',date:'公演日',category:'種別',fields:'詳細',images:'画像',thumbnail:'サムネイル'}[f]||f)).join('・')}）</span>`)),
      ];
      return `<div class="run"><h3>${r.date} <span class="n">${r.run_at.slice(11,16)} 取得 ／ 掲載 ${r.count} 件</span></h3>
        ${items.length?`<ul>${items.join('')}</ul>`:'<div class="quiet">変化なし</div>'}</div>`;
    }).join('');
  }

  let tab='events';
  function render(){ document.getElementById('filters').style.display = tab==='events'?'':'none'; tab==='events'?renderEvents():renderChanges(); }
  document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); }));
  ['status','cat','order'].forEach(id=>$('#'+id).addEventListener('change',renderEvents));
  $('#q').addEventListener('input',renderEvents);
  document.addEventListener('click',ev=>{
    const a=ev.target.closest('[data-goto]'); if(!a) return; ev.preventDefault();
    tab='events'; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='events'));
    $('#status').value='all'; $('#cat').value='all'; $('#q').value=''; render();
    const el=document.getElementById('ev-'+a.dataset.goto); if(el){ el.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); }
  });
  // 画像の拡大表示（ライトボックス）。同じ予定内の画像を ← → で切り替えられる
  const lb=$('#lb'), lbImg=lb.querySelector('img'), lbCnt=lb.querySelector('.cnt');
  let lbList=[], lbIdx=0;
  function lbShow(i){
    lbIdx=(i+lbList.length)%lbList.length;
    lbImg.src=lbList[lbIdx];
    lbCnt.textContent=lbList.length>1?`${lbIdx+1} / ${lbList.length}`:'';
    lb.querySelector('.prev').hidden=lb.querySelector('.next').hidden=lbList.length<2;
  }
  function lbOpen(list,i){ lbList=list; lb.classList.add('on'); document.body.style.overflow='hidden'; lbShow(i); }
  function lbClose(){ lb.classList.remove('on'); document.body.style.overflow=''; lbImg.src=''; }
  document.addEventListener('click',ev=>{
    const img=ev.target.closest('.detail img'); if(!img) return;
    ev.preventDefault();
    const imgs=[...img.closest('.detail').querySelectorAll('img')].map(x=>x.src);
    lbOpen(imgs, imgs.indexOf(img.src));
  });
  lb.addEventListener('click',ev=>{
    if(ev.target.closest('.prev')) lbShow(lbIdx-1);
    else if(ev.target.closest('.next')) lbShow(lbIdx+1);
    else lbClose();   // 画像・背景・× のクリックで閉じる
  });
  document.addEventListener('keydown',ev=>{
    if(!lb.classList.contains('on')) return;
    if(ev.key==='Escape') lbClose();
    else if(ev.key==='ArrowLeft') lbShow(lbIdx-1);
    else if(ev.key==='ArrowRight') lbShow(lbIdx+1);
  });
  render();
})();
</script>
</body>
</html>
